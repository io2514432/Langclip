<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Langclip · 브라우저 채점 실험 v2</title>
<style>
  :root { --bg:#0f1115; --fg:#e8eaed; --dim:#9aa0a6; --line:#242830; --ok:#4ade80; --warn:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg);
         font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
  h1 { font-size:19px; margin:0 0 6px; font-weight:600; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  button { flex:1 1 150px; padding:13px 14px; border-radius:10px; border:1px solid var(--line);
           background:#171a20; color:var(--fg); font-size:14px; font-weight:500; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .panel { border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .big { font-size:32px; font-weight:700; letter-spacing:-.5px; }
  .lbl { color:var(--dim); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;
           border-top:1px solid var(--line); padding-top:10px; }
  .sm { font-size:17px; font-weight:600; }
  pre { background:#0b0d11; border:1px solid var(--line); border-radius:10px; padding:12px;
        font-size:12px; color:var(--dim); overflow:auto; max-height:300px; white-space:pre-wrap; }
  .hint { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
  <h1>브라우저 채점 실험 v2</h1>
  <p class="sub">기준 발음을 녹음한 뒤 따라 말해보세요. 스펙트럼(VTLN) · 억양 · 리듬을 함께 봅니다. 음성은 서버로 전송되지 않습니다.</p>

  <div class="row">
    <button id="recA">① 기준 발음 녹음 (3초)</button>
    <button id="recB" disabled>② 내 발음 녹음 (3초)</button>
  </div>

  <div class="panel">
    <div class="grid">
      <div><div class="lbl">종합</div><div class="big" id="sAll">–</div></div>
      <div><div class="lbl">판정</div><div class="big" id="sVerd" style="font-size:15px;line-height:1.4;padding-top:8px;">–</div></div>
    </div>
    <div class="grid3">
      <div><div class="lbl">발음(스펙트럼)</div><div class="sm" id="sSpec">–</div></div>
      <div><div class="lbl">억양</div><div class="sm" id="sF0">–</div></div>
      <div><div class="lbl">리듬</div><div class="sm" id="sRhy">–</div></div>
    </div>
  </div>

  <pre id="log">준비됨.</pre>

<script>
"use strict";
const SR = 16000, WIN = 400, HOP = 320, NFFT = 512, NMEL = 24;
const ALPHAS = [0.88, 0.90, 0.92, 0.95, 0.98, 1.0, 1.02, 1.05, 1.08, 1.10, 1.12];
const logEl = document.getElementById("log");
const lines = [];
function log() {
  lines.push(Array.prototype.join.call(arguments, " "));
  logEl.textContent = lines.join("\n");
  logEl.scrollTop = logEl.scrollHeight;
}

/* ============ 녹음 / 디코딩 ============ */
async function record(sec) {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  const mr = new MediaRecorder(stream);
  const chunks = [];
  mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
  mr.start();
  await new Promise(function (r) { setTimeout(r, sec * 1000); });
  mr.stop();
  await new Promise(function (r) { mr.onstop = r; });
  stream.getTracks().forEach(function (t) { t.stop(); });
  return new Blob(chunks, { type: mr.mimeType || "audio/webm" });
}

async function blobToPcm(blob) {
  const buf = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const tmp = new AC();
  const dec = await tmp.decodeAudioData(buf);
  tmp.close();
  return resample16k(dec);
}

async function resample16k(dec) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  const mono = ctx.createBuffer(1, dec.length, dec.sampleRate);
  const ch0 = dec.getChannelData(0);
  const ch1 = dec.numberOfChannels > 1 ? dec.getChannelData(1) : null;
  const dst = mono.getChannelData(0);
  for (let i = 0; i < dec.length; i++) dst[i] = ch1 ? (ch0[i] + ch1[i]) / 2 : ch0[i];
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(dec.duration * SR)), SR);
  const src = off.createBufferSource();
  src.buffer = mono;
  src.connect(off.destination);
  src.start();
  const out = await off.startRendering();
  ctx.close();
  return out.getChannelData(0);
}

/* ============ FFT / 멜 ============ */
const hz2mel = function (f) { return 2595 * Math.log10(1 + f / 700); };
const mel2hz = function (m) { return 700 * (Math.pow(10, m / 2595) - 1); };

const BANK_CACHE = {};
function melBank(alpha) {
  const key = alpha.toFixed(2);
  if (BANK_CACHE[key]) return BANK_CACHE[key];
  const lo = hz2mel(80), hi = hz2mel(7600), pts = [];
  for (let i = 0; i < NMEL + 2; i++) pts.push(mel2hz(lo + (hi - lo) * i / (NMEL + 1)));
  const binHz = SR / NFFT, out = [];
  for (let m = 1; m <= NMEL; m++) {
    // VTLN: 목표 주파수를 alpha 배로 늘려 필터를 이동
    const c = pts[m] * alpha;
    const f0 = c - (c - pts[m - 1]) / alpha;
    const f1 = c;
    const f2 = c + (pts[m + 1] - c) / alpha;
    const w = new Float32Array(NFFT / 2 + 1);
    for (let k = 0; k <= NFFT / 2; k++) {
      const f = k * binHz;
      if (f >= f0 && f <= f1) w[k] = (f - f0) / (f1 - f0);
      else if (f > f1 && f <= f2) w[k] = (f2 - f) / (f2 - f1);
    }
    out.push(w);
  }
  BANK_CACHE[key] = out;
  return out;
}

function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), half = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < half; k++) {
        const ur = re[i + k], ui = im[i + k];
        const vr = re[i + k + half] * cr - im[i + k + half] * ci;
        const vi = re[i + k + half] * ci + im[i + k + half] * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi;
        re[i + k + half] = ur - vr; im[i + k + half] = ui - vi;
        const ncr = cr * wr - ci * wi;
        ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}

/* 무음 트리밍: 양 끝 조용한 구간 제거 */
function trim(pcm) {
  const fr = Math.floor((pcm.length - WIN) / HOP) + 1;
  if (fr < 3) return pcm;
  const e = new Float32Array(fr);
  for (let i = 0; i < fr; i++) {
    let s = 0;
    for (let k = 0; k < WIN; k++) { const v = pcm[i * HOP + k]; s += v * v; }
    e[i] = Math.sqrt(s / WIN);
  }
  const mx = Math.max.apply(null, e);
  if (mx < 1e-4) return pcm;
  const th = mx * 0.12;
  let a = 0, b = fr - 1;
  while (a < fr && e[a] < th) a++;
  while (b > a && e[b] < th) b--;
  a = Math.max(0, a - 2);
  b = Math.min(fr - 1, b + 2);
  return pcm.slice(a * HOP, Math.min(pcm.length, b * HOP + WIN));
}

/* ============ 특징 추출 ============ */
function analyze(pcm) {
  const y = trim(pcm);
  const fr = Math.floor((y.length - WIN) / HOP) + 1;
  const win = new Float32Array(WIN);
  for (let i = 0; i < WIN; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (WIN - 1));
  const re = new Float32Array(NFFT), im = new Float32Array(NFFT);
  const spec = [], rms = new Float32Array(fr), f0 = new Float32Array(fr);
  for (let i = 0; i < fr; i++) {
    const base = i * HOP;
    re.fill(0); im.fill(0);
    let en = 0;
    for (let k = 0; k < WIN; k++) { const v = y[base + k]; en += v * v; re[k] = v * win[k]; }
    rms[i] = Math.sqrt(en / WIN);
    fft(re, im);
    const p = new Float32Array(NFFT / 2 + 1);
    for (let k = 0; k <= NFFT / 2; k++) p[k] = re[k] * re[k] + im[k] * im[k];
    spec.push(p);
    f0[i] = pitchOf(y, base);
  }
  return { y: y, spec: spec, rms: rms, f0: f0, frames: fr, dur: y.length / SR };
}

/* 자기상관 기반 피치 (70~400Hz) */
function pitchOf(y, base) {
  const minLag = Math.floor(SR / 400), maxLag = Math.floor(SR / 70);
  let best = 0, bestLag = 0, e0 = 0;
  for (let k = 0; k < WIN; k++) { const v = y[base + k]; e0 += v * v; }
  if (e0 < 1e-6) return 0;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let s = 0, e1 = 0;
    for (let k = 0; k + lag < WIN; k++) { s += y[base + k] * y[base + k + lag]; e1 += y[base + k + lag] * y[base + k + lag]; }
    const r = s / Math.sqrt(e0 * e1 + 1e-12);
    if (r > best) { best = r; bestLag = lag; }
  }
  if (best < 0.28 || !bestLag) return 0;
  return SR / bestLag;
}

/* 스펙트럼 → 로그멜 (CMN + 프레임 단위벡터) */
function melFeats(spec, alpha) {
  const bank = melBank(alpha), fr = spec.length, out = [];
  for (let i = 0; i < fr; i++) {
    const p = spec[i], row = new Float32Array(NMEL);
    for (let m = 0; m < NMEL; m++) {
      let s = 0;
      const w = bank[m];
      for (let k = 0; k <= NFFT / 2; k++) s += p[k] * w[k];
      row[m] = Math.log(s + 1e-10);
    }
    out.push(row);
  }
  const mu = new Float32Array(NMEL);
  for (let i = 0; i < fr; i++) for (let m = 0; m < NMEL; m++) mu[m] += out[i][m] / fr;
  for (let i = 0; i < fr; i++) {
    let s2 = 0;
    for (let m = 0; m < NMEL; m++) { out[i][m] -= mu[m]; s2 += out[i][m] * out[i][m]; }
    const inv = 1 / Math.sqrt(s2 + 1e-12);
    for (let m = 0; m < NMEL; m++) out[i][m] *= inv;
  }
  return out;
}

/* ============ DTW ============ */
function dtw(A, B, costFn, bandRatio) {
  bandRatio = bandRatio || 0.3;
  const n = A.length, m = B.length;
  const band = Math.max(8, Math.floor(Math.max(n, m) * bandRatio));
  let prev = new Float64Array(m + 1).fill(Infinity);
  prev[0] = 0;
  for (let i = 1; i <= n; i++) {
    const cur = new Float64Array(m + 1).fill(Infinity);
    const lo = Math.max(1, i - band), hi = Math.min(m, i + band);
    for (let j = lo; j <= hi; j++) {
      const mn = Math.min(prev[j], prev[j - 1], cur[j - 1]);
      cur[j] = costFn(i - 1, j - 1) + mn;
    }
    prev = cur;
  }
  return prev[m] / Math.max(n, m);
}

/* 스펙트럼: 코사인 거리 */
function dSpec(A, B) {
  return dtw(A, B, function (i, j) {
    const a = A[i], b = B[j];
    let d = 1;
    for (let k = 0; k < NMEL; k++) d -= a[k] * b[k];
    return d < 0 ? 0 : d;
  });
}

/* 억양: 중앙값 대비 로그 f0 (무성음은 0으로) */
function f0Contour(x) {
  const v = [], out = new Float32Array(x.f0.length);
  for (let i = 0; i < x.f0.length; i++) if (x.f0[i] > 0) v.push(Math.log(x.f0[i]));
  if (v.length < 5) return null;
  v.sort(function (a, b) { return a - b; });
  const med = v[Math.floor(v.length / 2)];
  for (let i = 0; i < x.f0.length; i++) out[i] = x.f0[i] > 0 ? Math.log(x.f0[i]) - med : 0;
  return out;
}

function dF0(a, b) {
  const A = f0Contour(a), B = f0Contour(b);
  if (!A || !B) return null;
  return dtw(A, B, function (i, j) { const d = A[i] - B[j]; return d * d; });
}

/* 리듬: RMS 엔벨로프 (최대값 정규화) */
function env(x) {
  const mx = Math.max.apply(null, x.rms) || 1;
  const out = new Float32Array(x.rms.length);
  for (let i = 0; i < out.length; i++) out[i] = x.rms[i] / mx;
  return out;
}

function dRhythm(a, b) {
  const A = env(a), B = env(b);
  return dtw(A, B, function (i, j) { const d = A[i] - B[j]; return d * d; });
}

/* ============ 점수 ============ */
const CLAMP = function (v) { return Math.max(0, Math.min(100, v)); };
function logistic(d, d0, k) { return 100 / (1 + Math.exp(k * (d - d0))); }

function evaluate(ref, take) {
  // VTLN: 화자 음색 차이를 alpha 로 흡수
  let best = { d: Infinity, alpha: 1 };
  for (let i = 0; i < ALPHAS.length; i++) {
    const al = ALPHAS[i];
    const B = melFeats(take.spec, al);
    const d = dSpec(ref.specMel, B);
    if (d < best.d) best = { d: d, alpha: al };
  }
  const dF = dF0(ref, take);
  const dR = dRhythm(ref, take);
  const ratio = take.dur / Math.max(0.001, ref.dur);

  const sSpec = logistic(best.d, 0.30, 9.0);
  const sF0 = dF === null ? null : logistic(dF, 1.05, 1.5);
  const sRhy = CLAMP(100 - Math.abs(Math.log(Math.max(0.2, ratio))) * 90);
  const sRhythmShape = logistic(dR, 0.055, 45);

  const rhy = Math.round((sRhy * 0.5 + sRhythmShape * 0.5));
  const parts = [{ s: sSpec, w: 0.55 }];
  if (sF0 !== null) parts.push({ s: sF0, w: 0.25 });
  parts.push({ s: rhy, w: sF0 === null ? 0.45 : 0.20 });
  let wsum = 0, acc = 0;
  for (let i = 0; i < parts.length; i++) { acc += parts[i].s * parts[i].w; wsum += parts[i].w; }
  acc = acc / wsum;

  return {
    acc: acc, sSpec: sSpec, sF0: sF0, rhy: rhy,
    d: best.d, alpha: best.alpha, dF: dF, dR: dR,
    ratio: ratio, durRatioScore: sRhy, rhythmShape: sRhythmShape
  };
}

/* ============ UI ============ */
let REF = null, TAKE = null;
const bA = document.getElementById("recA");
const bB = document.getElementById("recB");

bA.onclick = async function () {
  try {
    log("① 녹음 중… 3초간 문장을 읽어주세요.");
    bA.disabled = true; bA.textContent = "녹음 중…";
    const blob = await record(3);
    let t = performance.now();
    const pcm = await blobToPcm(blob);
    const tDec = performance.now() - t;
    t = performance.now();
    const a = analyze(pcm);
    REF = a;
    REF.specMel = melFeats(a.spec, 1.0);
    const tFeat = performance.now() - t;
    log("기준: 프레임 " + a.frames + ", 길이 " + a.dur.toFixed(2) + "s, 유성음 " + Math.round(100 * voicedRatio(a)) + "%");
    log("  디코딩 " + tDec.toFixed(0) + "ms / 분석 " + tFeat.toFixed(0) + "ms");
    bA.textContent = "① 기준 다시 녹음";
    bB.disabled = false;
  } catch (e) {
    log("오류: " + e.message);
    bA.disabled = false; bA.textContent = "① 기준 발음 녹음 (3초)";
  }
};

bB.onclick = async function () {
  if (!REF) return;
  try {
    log("② 녹음 중… 3초간 따라 말해주세요.");
    bB.disabled = true; bB.textContent = "녹음 중…";
    const blob = await record(3);
    let t = performance.now();
    const pcm = await blobToPcm(blob);
    const tDec = performance.now() - t;
    t = performance.now();
    TAKE = analyze(pcm);
    const tFeat = performance.now() - t;
    t = performance.now();
    const r = evaluate(REF, TAKE);
    const tEval = performance.now() - t;

    document.getElementById("sAll").textContent = Math.round(r.acc);
    document.getElementById("sSpec").textContent = Math.round(r.sSpec);
    document.getElementById("sF0").textContent = r.sF0 === null ? "–" : Math.round(r.sF0);
    document.getElementById("sRhy").textContent = r.rhy;
    document.getElementById("sVerd").textContent =
      r.acc >= 85 ? "아주 좋아요" : r.acc >= 70 ? "거의 맞았어요" : r.acc >= 50 ? "조금 더 또렷하게" : "다시 시도";

    log("내 발음: 프레임 " + TAKE.frames + ", 길이 " + TAKE.dur.toFixed(2) + "s, 유성음 " + Math.round(100 * voicedRatio(TAKE)) + "%");
    log("  디코딩 " + tDec.toFixed(0) + "ms / 분석 " + tFeat.toFixed(0) + "ms / 채점 " + tEval.toFixed(0) + "ms");
    log("  d_스펙트럼 " + r.d.toFixed(3) + " (VTLN α=" + r.alpha.toFixed(2) + "), d_억양 " + (r.dF === null ? "n/a" : r.dF.toFixed(3)) + ", d_리듬 " + r.dR.toFixed(4));
    log("  길이비 " + r.ratio.toFixed(2) + " → 스펙트럼 " + Math.round(r.sSpec) + " / 억양 " + (r.sF0 === null ? "-" : Math.round(r.sF0)) + " / 리듬 " + r.rhy);
    log("  종합 " + r.acc.toFixed(1));
    bB.textContent = "② 다시 녹음";
    bB.disabled = false;
  } catch (e) {
    log("오류: " + e.message);
    bB.disabled = false; bB.textContent = "② 내 발음 녹음 (3초)";
  }
};

function voicedRatio(x) {
  let n = 0;
  for (let i = 0; i < x.f0.length; i++) if (x.f0[i] > 0) n++;
  return x.f0.length ? n / x.f0.length : 0;
}
</script>
</body>
</html>
